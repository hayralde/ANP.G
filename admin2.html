<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projeto 2 | Admin 2 | ANP</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .nav-links{display:flex;flex-wrap:wrap;align-items:center;gap:.25rem}
    .nav-sair{background:transparent;border:1px solid #475569;border-radius:8px;cursor:pointer;font-family:inherit;padding:.35rem .65rem}
    .nav-sair:hover{background:#ef4444;border-color:#ef4444;color:#fff!important}
    .edit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
    .edit-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:1rem;cursor:pointer}
    .edit-card:hover{border-color:#f59e0b}
    .edit-card h3{margin:0 0 .2rem;font-size:.92rem}
    .edit-card p{margin:0 0 .6rem;font-size:.78rem;color:var(--text-secondary)}
    .edit-card-top{display:flex;justify-content:space-between;gap:.5rem}
    .btn-excluir-soft{background:transparent;border:none;color:#64748b;font-size:.75rem;font-weight:600;cursor:pointer;text-decoration:underline;font-family:inherit}
    .btn-excluir-soft:hover{color:#ef4444}
    .toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.75rem;margin-bottom:1rem;align-items:center}
    .btn-nova{background:#f59e0b;border:none;color:#0f172a;font-weight:700;padding:.55rem 1rem;border-radius:8px;cursor:pointer}
    .modal-backdrop{position:fixed;inset:0;background:rgba(2,6,23,.75);display:none;align-items:center;justify-content:center;z-index:1000;padding:1rem;overflow-y:auto}
    .modal-backdrop.open{display:flex}
    .modal{background:#1e293b;border:1px solid #334155;border-radius:16px;width:100%;max-width:480px;padding:1.25rem 1.4rem;max-height:92vh;overflow-y:auto}
    .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
    .modal-header h2{margin:0;font-size:1.1rem}
    .modal-close{background:none;border:none;color:#94a3b8;font-size:1.4rem;cursor:pointer}
    .field{margin-bottom:.85rem}
    .field label{display:block;font-size:.68rem;font-weight:600;text-transform:uppercase;color:#64748b;margin-bottom:.3rem}
    .field input,.field select,.field textarea{width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#f1f5f9;padding:.6rem .75rem;font-size:.9rem;font-family:inherit}
    .field-row{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
    .itens-box{border:1px solid #334155;border-radius:8px;padding:.5rem;background:#0f172a}
    .item-row{display:flex;gap:.4rem;margin-bottom:.35rem}.item-row input{flex:1}
    .item-row button{background:#334155;border:none;color:#94a3b8;width:30px;border-radius:6px;cursor:pointer}
    .btn-add-item{width:100%;background:transparent;border:1px dashed #475569;color:#94a3b8;padding:.45rem;border-radius:6px;cursor:pointer}
    .modal-footer{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1rem;padding-top:.75rem;border-top:1px solid #334155}
    .btn-cancel{background:transparent;border:1px solid #475569;color:#cbd5e1;padding:.5rem 1rem;border-radius:8px;cursor:pointer}
    .btn-save{background:#f59e0b;border:none;color:#0f172a;font-weight:700;padding:.5rem 1rem;border-radius:8px;cursor:pointer}
    #status-bar{font-size:.85rem;color:#64748b}#status-bar.ok{color:#22c55e}#status-bar.err{color:#ef4444}
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="navbar-brand"><div class="logo">ANP</div><span>Projeto 2</span></a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Início</a>
      <a href="kanban2.html" class="nav-link">Kanban</a>
      <a href="prazos2.html" class="nav-link">Prazos 2</a>
      <a href="admin2.html" class="nav-link active">Admin 2</a>
      <button type="button" class="nav-link nav-sair" id="btn-sair">Sair</button>
    </div>
  </nav>
  <section id="login-section" class="login-container">
    <div class="login-box">
      <h2>Admin 2 — Projeto 2</h2>
      <p class="subtitle">CRUD do Plano 2 (planilha)</p>
      <div id="login-error" class="login-error"></div>
      <form id="login-form">
        <div class="form-group"><label for="username">Usuário</label><input type="text" id="username" class="form-input" required placeholder="admin" /></div>
        <div class="form-group"><label for="password">Senha</label><input type="password" id="password" class="form-input" required /></div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:.75rem">Entrar</button>
      </form>
    </div>
  </section>
  <section id="admin-section" class="container" style="display:none">
    <header class="page-header"><h1>Admin 2 — CRUD</h1><p>Adicionar, editar e excluir atividades do Projeto 2</p></header>
    <div class="toolbar"><span id="status-bar">—</span><button type="button" class="btn-nova" id="btn-nova">+ Nova atividade</button></div>
    <div class="edit-grid" id="edit-grid"></div>
  </section>
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal">
      <div class="modal-header"><h2 id="modal-title">Editar atividade</h2><button type="button" class="modal-close" id="modal-close">&times;</button></div>
      <form id="edit-form">
        <input type="hidden" id="f-id" />
        <div class="field"><label>Área / Categoria</label><input type="text" id="f-area" list="areas-list" /></div>
        <datalist id="areas-list"></datalist>
        <div class="field"><label>Tarefa</label><input type="text" id="f-tarefa" required /></div>
        <div class="field"><label>Subtarefa</label><input type="text" id="f-subtarefa" /></div>
        <div class="field-row"><div class="field"><label>Responsável</label><select id="f-responsavel"></select></div><div class="field"><label>Pendência de</label><select id="f-pendencia"></select></div></div>
        <div class="field-row"><div class="field"><label>Tipo de demanda</label><select id="f-tipo"></select></div><div class="field"><label>Status</label><select id="f-status"></select></div></div>
        <div class="field-row">
          <div class="field"><label>Data inicial</label><input type="date" id="f-previsao-inicio" /></div>
          <div class="field"><label>Data final</label><input type="date" id="f-previsao-fim" /></div>
        </div>
        <div class="field"><label>Observações</label><textarea id="f-obs" rows="2"></textarea></div>
        <div class="field"><label>Itens / Sub-ações</label><div class="itens-box"><div id="itens-list"></div><button type="button" class="btn-add-item" id="btn-add-item">+ Adicionar item</button></div></div>
        <div class="modal-footer"><button type="button" class="btn-cancel" id="btn-cancel">Cancelar</button><button type="submit" class="btn-save" id="btn-save">Salvar</button></div>
      </form>
    </div>
  </div>
  <script src="js/data2.js"></script>
  <script src="js/delete-helper.js"></script>
  <script src="js/admin2.js"></script>
  <script>(function(){var b=document.getElementById("btn-sair");if(b)b.onclick=function(){try{sessionStorage.removeItem("anp_admin2_session");}catch(e){}location.href="index.html";};})();</script>
</body>
</html>
