<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projeto 1 | Dashboard | ANP</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    .nav-links{display:flex;flex-wrap:wrap;align-items:center;gap:.25rem}
    .nav-sair{background:transparent;border:1px solid #475569;border-radius:8px;cursor:pointer;font-family:inherit;padding:.35rem .65rem}
    .nav-sair:hover{background:#ef4444;border-color:#ef4444;color:#fff!important}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="navbar-brand"><div class="logo">ANP</div><span>Projeto 1</span></a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Início</a>
      <a href="dashboard.html" class="nav-link active">Dashboard</a>
      <a href="prazos.html" class="nav-link">Prazos</a>
      <a href="5w2h.html" class="nav-link">5W2H</a>
      <a href="5w2h-lista.html" class="nav-link">Lista</a>
      <a href="5w2h-mapa.html" class="nav-link">Mapa</a>
      <a href="editar.html" class="nav-link">Editar</a>
      <a href="admin.html" class="nav-link">Admin</a>
      <button type="button" class="nav-link nav-sair" id="btn-sair">Sair</button>
    </div>
  </nav>
  <main class="container">
    <header class="page-header"><h1>Dashboard — Plano de Ação ANP</h1><p>Projeto 1 · progresso em tempo real</p></header>
    <section class="kpi-grid">
      <div class="kpi-card total"><div class="kpi-label">Total</div><div class="kpi-value" id="kpi-total">0</div><div class="kpi-sub" id="kpi-pct">0%</div></div>
      <div class="kpi-card concluido"><div class="kpi-label">Concluídas</div><div class="kpi-value" id="kpi-concluido">0</div></div>
      <div class="kpi-card andamento"><div class="kpi-label">Em Andamento</div><div class="kpi-value" id="kpi-andamento">0</div></div>
      <div class="kpi-card parado"><div class="kpi-label">Paradas</div><div class="kpi-value" id="kpi-parado">0</div></div>
      <div class="kpi-card definir"><div class="kpi-label">A Definir</div><div class="kpi-value" id="kpi-definir">0</div></div>
    </section>
    <section class="charts-grid">
      <div class="chart-card"><h3>Por Status</h3><div class="chart-container"><canvas id="chart-status"></canvas></div></div>
      <div class="chart-card"><h3>Por Responsável</h3><div class="chart-container"><canvas id="chart-responsavel"></canvas></div></div>
      <div class="chart-card"><h3>Por Categoria</h3><div class="chart-container"><canvas id="chart-categoria"></canvas></div></div>
    </section>
    <section>
      <div class="page-header" style="margin-bottom:1rem"><h1 style="font-size:1.35rem">Atividades</h1></div>
      <div class="filters-bar">
        <div class="filter-group"><label for="filter-status">Status</label><select id="filter-status" class="filter-select"><option value="">Todos</option><option value="A DEFINIR">A Definir</option><option value="PARADO">Parado</option><option value="EM ANDAMENTO">Em Andamento</option><option value="CONCLUIDO">Concluído</option></select></div>
        <div class="filter-group"><label for="filter-responsavel">Responsável</label><select id="filter-responsavel" class="filter-select"><option value="">Todos</option></select></div>
        <div class="filter-group"><label for="filter-categoria">Categoria</label><select id="filter-categoria" class="filter-select"><option value="">Todas</option></select></div>
        <div class="filter-group"><label for="filter-search">Buscar</label><input type="search" id="filter-search" class="filter-input" placeholder="Tarefa..." /></div>
        <div class="filter-group" style="justify-content:flex-end"><label>&nbsp;</label><button type="button" id="btn-clear-filters" class="btn btn-secondary">Limpar</button></div>
      </div>
      <div class="cards-grid" id="cards-container"></div>
    </section>
  </main>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>(function(){var b=document.getElementById("btn-sair");if(b)b.onclick=function(){try{sessionStorage.removeItem("anp_admin_session");}catch(e){}location.href="index.html";};})();</script>
</body>
</html>
