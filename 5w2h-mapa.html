<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5W2H Mapa | ANP Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    .nav-links{display:flex;flex-wrap:wrap;align-items:center;gap:.25rem}
    .nav-sair{background:transparent;border:1px solid #475569;border-radius:8px;cursor:pointer;font-family:inherit;margin-left:.15rem;padding:.35rem .65rem}
    .nav-sair:hover{background:#ef4444;border-color:#ef4444;color:#fff!important}
    .mapa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
    .mini-card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:.85rem;display:flex;flex-direction:column;gap:.55rem}
    .mini-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem}
    .mini-card-top h3{margin:0;font-size:.88rem;font-weight:700;color:#f1f5f9;line-height:1.3}
    .mini-card-top p{margin:.2rem 0 0;font-size:.72rem;color:#94a3b8}
    .mini-center{width:64px;height:64px;border-radius:50%;background:#fff;border:2px solid #0f172a;display:flex;align-items:center;justify-content:center;margin:0;font-size:.72rem;font-weight:800;color:#0f172a;flex-shrink:0}
    .mini-cells{display:grid;grid-template-columns:1fr 1fr;gap:.35rem}
    .mini-cell{border-radius:8px;padding:.4rem .5rem;min-height:52px}
    .mini-cell strong{display:block;font-size:.65rem;font-weight:800;color:#0f172a;margin-bottom:.15rem}
    .mini-cell span{font-size:.68rem;color:#1e293b;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .mc-what{background:#fef9c3}.mc-why{background:#ffedd5}.mc-who{background:#fce7f3}
    .mc-where{background:#ecfccb}.mc-when{background:#e0f2fe}.mc-how{background:#ede9fe}
    .mc-howmuch{background:#e9d5ff;grid-column:1/-1;text-align:center;min-height:auto}
    .mini-actions{display:flex;justify-content:flex-end}
    .btn-excluir-soft{background:transparent;border:none;color:#64748b;font-size:.75rem;font-weight:600;cursor:pointer;padding:.25rem .4rem;border-radius:6px;font-family:inherit;text-decoration:underline;text-underline-offset:2px}
    .btn-excluir-soft:hover{color:#ef4444}
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="navbar-brand"><div class="logo">ANP</div><span>Monitor de Atividades</span></a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Dashboard</a>
      <a href="prazos.html" class="nav-link">Prazos</a>
      <a href="5w2h.html" class="nav-link">5W2H</a>
      <a href="5w2h-lista.html" class="nav-link">Lista</a>
      <a href="5w2h-mapa.html" class="nav-link active">Mapa</a>
      <a href="editar.html" class="nav-link">Editar</a>
      <a href="admin.html" class="nav-link">Admin</a>
      <button type="button" class="nav-link nav-sair" id="btn-sair">Sair</button>
    </div>
  </nav>
  <main class="container">
    <header class="page-header">
      <h1>5W2H — Mapa</h1>
      <p>Todas as atividades em cards compactos no formato 5W2H</p>
    </header>
    <div class="mapa-grid" id="mapa-grid"><p style="color:var(--text-muted)">Carregando...</p></div>
  </main>
  <script src="js/data.js"></script>
  <script src="js/delete-helper.js"></script>
  <script src="js/5w2h-mapa.js"></script>
  <script>
    (function(){var b=document.getElementById("btn-sair");if(!b)return;b.addEventListener("click",function(){try{sessionStorage.removeItem("anp_admin_session");}catch(e){}location.href="index.html";});})();
  </script>
</body>
</html>
