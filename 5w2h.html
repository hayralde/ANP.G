<!DOCTYPE html>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .w2h-grid{display:grid;gap:1.25rem}.w2h-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
    .w2h-card-head{padding:1rem 1.15rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:1rem;background:rgba(0,0,0,.15)}
    .w2h-card-head h2{font-size:1rem;margin:0}.w2h-card-head p{font-size:.8rem;color:var(--text-secondary);margin:.25rem 0 0}
    .w2h-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
    .w2h-item{padding:.85rem 1rem;border-right:1px solid var(--border);border-bottom:1px solid var(--border);min-height:90px}
    .w2h-label{font-size:.65rem;text-transform:uppercase;color:var(--text-muted);font-weight:700;margin-bottom:.3rem}
    .w2h-value{font-size:.82rem;line-height:1.4}.w2h-empty{text-align:center;padding:3rem;color:var(--text-muted)}
    .nav-links{display:flex;flex-wrap:wrap;align-items:center;gap:.25rem}
    .nav-sair{background:transparent;border:1px solid #475569;border-radius:8px;cursor:pointer;font-family:inherit;padding:.35rem .65rem}
    .nav-sair:hover{background:#ef4444;border-color:#ef4444;color:#fff!important}
  </style>
</head>

      <div class="filter-group"><label for="filter-status">Status</label><select id="filter-status" class="filter-select"><option value="">Todos</option><option value="A DEFINIR">A Definir</option><option value="PARADO">Parado</option><option value="EM ANDAMENTO">Em Andamento</option><option value="CONCLUIDO">Concluído</option></select></div>

      <div class="filter-group" style="justify-content:flex-end"><label>&nbsp;</label><button type="button" id="btn-clear" class="btn btn-secondary">Limpar</button></div>
    </div>
    <div class="w2h-grid" id="w2h-container"><div class="w2h-empty">Carregando...</div></div>
