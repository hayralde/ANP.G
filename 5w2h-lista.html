<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5W2H Lista | ANP Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    .w2h-list-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-card)}
    .w2h-list-table{width:100%;border-collapse:collapse;min-width:1000px;font-size:.82rem}
    .w2h-list-table thead th{background:#0f172a;color:var(--text-secondary);font-size:.7rem;text-transform:uppercase;padding:.85rem .75rem;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
    .w2h-list-table tbody td{padding:.85rem .75rem;border-bottom:1px solid var(--border);vertical-align:top}
    .nav-links{display:flex;flex-wrap:wrap;align-items:center;gap:.25rem}
    .nav-sair{background:transparent;border:1px solid #475569;border-radius:8px;cursor:pointer;font-family:inherit;padding:.35rem .65rem}
    .nav-sair:hover{background:#ef4444;border-color:#ef4444;color:#fff!important}
    .btn-excluir-soft{background:transparent;border:none;color:#64748b;font-size:.75rem;font-weight:600;cursor:pointer;text-decoration:underline;font-family:inherit}
    .btn-excluir-soft:hover{color:#ef4444}
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="navbar-brand"><div class="logo">ANP</div><span>Monitor de Atividades</span></a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Dashboard</a>
      <a href="prazos.html" class="nav-link">Prazos</a>
      <a href="5w2h.html" class="nav-link">5W2H</a>
      <a href="5w2h-lista.html" class="nav-link active">Lista</a>
      <a href="5w2h-mapa.html" class="nav-link">Mapa</a>
      <a href="editar.html" class="nav-link">Editar</a>
      <a href="admin.html" class="nav-link">Admin</a>
      <button type="button" class="nav-link nav-sair" id="btn-sair">Sair</button>
    </div>
  </nav>
  <main class="container">
    <header class="page-header"><h1>5W2H em Lista</h1><p>Visão tabular da matriz 5W2H</p></header>
    <div class="filters-bar">
      <div class="filter-group"><label for="filter-status">Status</label>
        <select id="filter-status" class="filter-select"><option value="">Todos</option><option value="A DEFINIR">A Definir</option><option value="PARADO">Parado</option><option value="EM ANDAMENTO">Em Andamento</option><option value="CONCLUIDO">Concluído</option></select>
      </div>
      <div class="filter-group"><label for="filter-responsavel">Responsável</label><select id="filter-responsavel" class="filter-select"><option value="">Todos</option></select></div>
      <div class="filter-group"><label for="filter-search">Buscar</label><input type="search" id="filter-search" class="filter-input" placeholder="Tarefa..." /></div>
      <div class="filter-group" style="justify-content:flex-end"><label>&nbsp;</label><button type="button" id="btn-clear" class="btn btn-secondary">Limpar</button></div>
    </div>
    <div class="w2h-list-wrap">
      <table class="w2h-list-table">
        <thead><tr><th>ID</th><th>Status</th><th>What</th><th>Why</th><th>Where</th><th>When</th><th>Who</th><th>How</th><th>How much</th><th>Ações</th></tr></thead>
        <tbody id="w2h-list-body"><tr><td colspan="10" style="text-align:center;padding:2rem;color:var(--text-muted)">Carregando...</td></tr></tbody>
      </table>
    </div>
  </main>
  <script src="js/data.js"></script>
  <script src="js/delete-helper.js"></script>
  <script src="js/5w2h-lista.js"></script>
  <script>(function(){var b=document.getElementById("btn-sair");if(!b)return;b.addEventListener("click",function(){try{sessionStorage.removeItem("anp_admin_session");}catch(e){}location.href="index.html";});})();</script>
</body>
</html>
